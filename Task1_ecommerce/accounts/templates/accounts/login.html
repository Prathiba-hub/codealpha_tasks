<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:linear-gradient(to right,#d4fc79,#96e6a1);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            background:white;
            padding:40px;
            width:350px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            margin-bottom:30px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:black;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#00b894;
        }

        a{
            text-decoration:none;
            color:#00b894;
        }

    </style>

</head>
<body>

    <div class="login-box">

        <h1>🛍 Welcome Back</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="username" placeholder="Enter Username" required>

            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>

        </form>

        <p style="margin-top:20px;">
            Don't have an account?
            <a href="/register/">Register</a>
        </p>

    </div>

</body>
</html>
