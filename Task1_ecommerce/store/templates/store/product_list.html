<!DOCTYPE html>
<html>
<head>
    <title>Fashion Store</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f5f5f5;
            margin:0;
            padding:20px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        .product-container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        .product-card{
            background:white;
            width:280px;
            padding:15px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .product-card:hover{
            transform:scale(1.03);
        }

        .product-card img{
            width:100%;
            height:300px;
            object-fit:cover;
            border-radius:10px;
        }

        .product-card h2{
            margin-top:15px;
        }

        .price{
            color:green;
            font-size:20px;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div style="
    background:black;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
">

    <h2>Fashion Store</h2>

    <div>

        <a href="/register/" style="
            color:white;
            text-decoration:none;
            margin-right:20px;
        ">
            Register
        </a>

        <a href="/login/" style="
            color:white;
            text-decoration:none;
        ">
            Login
        </a>

        <a href="/cart/" style="
    color:white;
    text-decoration:none;
    margin-left:20px;
">
    Cart
</a>

    </div>

</div>

    <h1>✨ My Fashion Store ✨</h1>

    <div class="product-container">

        {% for product in products %}

        <div class="product-card">

            <img src="{{ product.image.url }}">

            <h2>{{ product.name }}</h2>

            <p class="price">₹{{ product.price }}</p>

            <p>{{ product.description }}</p>

            <a href="/add-to-cart/{{ product.id }}/">

    <button style="
        background:black;
        color:white;
        padding:10px;
        border:none;
        cursor:pointer;
        width:100%;
    ">
        Add To Cart
    </button>

</a>

        </div>

        {% endfor %}

    </div>

</body>
</html>
