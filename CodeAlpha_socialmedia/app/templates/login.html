<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f0f2f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:350px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#1877f2;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:12px;
            border:none;
            background:#f0f2f5;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            background:#1877f2;
            color:white;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#166fe5;
        }

        .bottom{
            text-align:center;
            margin-top:20px;
        }

        a{
            text-decoration:none;
            color:#1877f2;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>SocialApp</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>

    </form>

    <div class="bottom">

        Don't have an account?

        <a href="/register/">
            Register
        </a>

    </div>

</div>

</body>

</html>
