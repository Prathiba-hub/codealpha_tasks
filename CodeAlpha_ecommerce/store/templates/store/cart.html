<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>

    <style>

        body{
            margin:0;
            padding:20px;
            font-family:Arial;
            background:#f5f5f5;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
            color:#333;
        }

        .cart-container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        .cart-card{
            background:white;
            width:280px;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .cart-card:hover{
            transform:scale(1.03);
        }

        .cart-card img{
            width:100%;
            height:300px;
            object-fit:cover;
            border-radius:10px;
        }

        .cart-card h2{
            margin-top:15px;
            color:#444;
        }

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
        }

        .total-box{
            margin-top:50px;
            text-align:center;
            background:white;
            padding:30px;
            border-radius:15px;
            width:350px;
            margin-left:auto;
            margin-right:auto;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        .order-btn{
            padding:15px 40px;
            background:black;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        .order-btn:hover{
            background:#ff4d6d;
        }

    </style>

</head>

<body>

    <h1>🛒 Your Shopping Cart</h1>

    <div class="cart-container">

        {% for product in products %}

        <div class="cart-card">

            <img src="{{ product.image.url }}">

            <h2>{{ product.name }}</h2>

            <p class="price">₹{{ product.price }}</p>

        </div>

        {% endfor %}

    </div>

    <div class="total-box">

        <h2>Total Amount: ₹{{ total }}</h2>

        <br>

        <a href="/place-order/">

            <button class="order-btn">
                Place Order
            </button>

        </a>

    </div>

</body>
</html>
